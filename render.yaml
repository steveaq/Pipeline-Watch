# Optional paid always-on service. This file does not provision anything by itself.
services:
  - type: web
    name: pipeline-watch
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /_stcore/health
