version: 2
sources:
  - name: warehouse
    schema: main
    tables:
      - name: silver_trips
        columns:
          - name: row_id
            data_tests: [not_null]
          - name: pickup_at
            data_tests: [not_null]
          - name: month
            data_tests: [not_null]
      - name: taxi_zones
        columns:
          - name: LocationID
            data_tests: [unique, not_null]
models:
  - name: zone_daily
    columns:
      - name: day
        data_tests: [not_null]
      - name: pickup_zone
        data_tests: [not_null]
      - name: trip_count
        data_tests: [not_null]
